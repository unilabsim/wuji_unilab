[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["wuji_unilab", "unisupermimic"]
source-exclude = ["/src/unisupermimic/tasks/pen_spin/data/rawdata/**"]

[project]
name = "wuji-unilab"
version = "0.1.0"
description = "Wuji Hand reorientation and training capability validation on UniLab mjwarp"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
dependencies = [
  "unilab[mjwarp,mujoco]==1.5.1",
  "unisim-core==2.1.1",
  "torch>=2.9,<2.15 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.16.0",
  "rsl-rl-lib==5.5.1",
  "scipy>=1.15,<2",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "wuji-description",
]

[project.entry-points."unilab.tasks"]
wuji_unilab = "wuji_unilab.tasks"
unisupermimic = "unisupermimic.tasks"

[project.scripts]
wuji-train = "wuji_unilab.cli:train_main"
wuji-play = "wuji_unilab.cli:play_main"
wuji-list-envs = "wuji_unilab.cli:list_main"
wuji-assets = "wuji_unilab.assets:main"
wuji-export = "wuji_unilab.export:main"
wuji-eval = "wuji_unilab.eval:main"
unisupermimic-hand2-train = "unisupermimic.scripts.train_hand2_supermimic:hydra_main"
unisupermimic-hand2-eval = "unisupermimic.tasks.dex_reorient.hand2.evaluate:main"
unisupermimic-hand2-ppo = "unisupermimic.scripts.train_hand2_ppo:hydra_main"
unisupermimic-hand1-train = "unisupermimic.scripts.train_dex_supermimic:hand1_main"
unisupermimic-hand1-play = "unisupermimic.tasks.dex_reorient.hand1.play:main"
unisupermimic-pen-spin-train = "unisupermimic.scripts.train_dex_supermimic:pen_main"
unisupermimic-pen-spin-play = "unisupermimic.tasks.pen_spin.play:main"
unisupermimic-pen-spin-ppo = "unisupermimic.scripts.train_pen_spin_ppo:hydra_main"
unisupermimic-pen-spin-download = "unisupermimic.tasks.pen_spin.tooling.download:main"

[project.optional-dependencies]
deploy = ["opencv-contrib-python>=4.13,<5", "pupil-apriltags>=1.0", "pyzmq>=27", "wujihandpy==1.8.0", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "pyright>=1.1.408"]


[[tool.uv.index]]
name = "r2-cu130"
url = "https://download-r2.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "r2-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
wuji-description = { path = "third_party/wuji-description" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src/wuji_unilab"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and the actual mjwarp backend", "slow: bounded training or integration tests"]
addopts = "--tb=short -m 'not gpu and not slow'"

