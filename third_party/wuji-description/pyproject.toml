[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wuji-description"
version = "0.1.0"
description = "Pinned Wuji Hand 1 and Hand 2 MJCF and mesh resources"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wuji_description = ["resources/**/*.xml", "resources/**/*.STL", "resources/**/*.stl"]
