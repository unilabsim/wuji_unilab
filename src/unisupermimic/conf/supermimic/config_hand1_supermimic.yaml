# @package _global_
# Hand 1 SuperMimic world-model recipe.  The environment is deliberately
# selected here instead of relying on the G1 default in ``config.yaml``.
defaults:
  - task: dex_hand1_reorient/mjwarp
  - _self_

# Dex-SuperMimic's Hand 1 recipe runs at 50 Hz (20 ms control steps).  The
# native PPO migration keeps its separate UniLab configuration and timing.
env:
  ctrl_dt: 0.02
  # SuperMimic keeps the terminal transition in replay and resets selected
  # rows explicitly in its collector; PPO uses a separate autoreset path.
  auto_reset: false
  commands:
    reorient:
      success_hold_steps: 13
      goal_switch_delay: 50
  actions:
    joint_pos:
      ema_alpha: 0.3
  terminations:
    cage_drop:
      params:
        max_outside_steps: 25
        max_count: 37.5
  observations:
    critic:
      # The source SuperMimic critic reconstructs one clean privileged frame
      # during imagination.  The native PPO task keeps its three-frame critic
      # history in the separate config_ppo recipe.
      terms:
        joint: {history_length: 1}
        target_error: {history_length: 1}
        position: {history_length: 1}
        orientation: {history_length: 1}
        action: {history_length: 1}
        qpos: {history_length: 1}
        qvel: {history_length: 1}
        tips: {history_length: 1}
        clean_position: {history_length: 1}
        clean_orientation: {history_length: 1}
        clean_linvel: {history_length: 1}
        clean_angvel: {history_length: 1}
        clean_force_direction: {history_length: 1}
        clean_perturbation: {history_length: 1}
        clean_progress: {history_length: 1}
        clean_cage:
          history_length: 1
          params:
            max_outside_steps: 25
        clean_dr: {history_length: 1}
        clean_palm: {history_length: 1}
  curriculum:
    adaptive_episode:
      params:
        target_steps: 2000
reward:
  action_rate:
    weight: 0.0
  action_hf:
    weight: -30.0
  hold_escalation:
    weight: 4.694
  cage_escape:
    params:
      max_outside_steps: 25
      max_count: 37.5

algo:
  task: hand1-reorient
  algorithm: world_model
  seed: 42
  num_envs: 1024
  iterations: 8000
  buffer_steps: 1000
  warmup_steps: 64
  utd: 0.4
  wm_only_iters: 500
  wm_window: 8
  wm_failure_frac: 0.25
  wm_failure_horizon: 16
  final_state_weight: 1.0
  contact_weight: 0.1
  wm_batches: 10
  wm_batch: 2048
  wm_hidden: [2048, 2048, 2048]
  pi_batch: 1024
  horizon: 32
  max_horizon: 32
  horizon_ramp_iters: 1000
  critic_epochs: 5
  critic_minibatches: 4
  gamma: 0.99
  lam: 0.95
  lr: 0.0002
  lr_decay_iters: 250000
  lr_final_ratio: 0.03
  action_noise: 0.1
  failure_warmup_iters: 300
  failure_head: true
  failure_clip: 0.1
  amp: true
  compile: true
  compile_policy: true
  compile_policy_dynamic: false
  profile: false
  save_interval: 100
  log_interval: 50
  holdout_fraction: 0.1
  checkpoint: null
  model_checkpoint: null
  reset_model_statistics: false
  variant: fixed
  logger: tensorboard

training:
  task_name: DexHand1Reorient
  sim_backend: mjwarp
  collector_tensor_device: cuda:0
  log_dir: m_ends/hand1_reorient
  torch_num_threads: 4

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
